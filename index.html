<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#07060f"/>
<meta name="description" content="Crypto Tracker"/>
<title>Crypto Tracker</title>
<link rel="apple-touch-icon" href="icon.svg"/>
<link rel="icon" href="icon.svg"/>
<link rel="manifest" href="manifest.json"/>
<link rel="stylesheet" href="styles.css?v=91"/>
</head>
<body>
<header class="topbar">
  <div class="logo"><span>₿</span> Crypto Tracker</div>
  <div class="top-actions">
    <span class="chip" id="mcapChip">Cap: —</span>
    <span class="chip" id="domChip">BTC: —</span>
    <span class="chip" id="ethDomChip">ETH: —</span>
    <select id="curSel" class="select" aria-label="Currency">
      <option value="usd">USD</option>
      <option value="eur">EUR</option>
      <option value="rub">RUB</option>
      <option value="pln">PLN</option>
    </select>
    <select id="langSel" class="select" aria-label="Language">
      <option value="ru">RU</option>
      <option value="en">EN</option>
    </select>
    <button type="button" class="select" id="themeBtn">Светлая</button>
  </div>
</header>
<nav class="bottom-nav" id="nav">
  <button type="button" class="nav-btn on" data-p="home">
    <svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 10.5L12 3l9 7.5V20a1 1 0 01-1 1h-5v-6H9v6H4a1 1 0 01-1-1v-9.5z"/></svg>
    <span data-i18n="nav_home">Главная</span>
  </button>
  <button type="button" class="nav-btn" data-p="port">
    <svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19V9M10 19V5M16 19v-7M22 19H2"/></svg>
    <span data-i18n="nav_port">Портфель</span>
  </button>
  <button type="button" class="nav-btn" data-p="wallet">
    <svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="6" width="20" height="14" rx="2"/><path d="M2 10h20"/><circle cx="17" cy="14" r="1.5"/></svg>
    <span data-i18n="nav_wallet">Кошелёк</span>
  </button>
  <button type="button" class="nav-btn" data-p="news">
    <svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 5h16v14H4zM8 9h8M8 13h5"/></svg>
    <span data-i18n="nav_news">Новости</span>
  </button>
  <button type="button" class="nav-btn" data-p="tools">
    <svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2"/></svg>
    <span data-i18n="nav_tools">Инструменты</span>
  </button>
</nav>
<div class="wrap">
  <section class="page on" id="p-home">
    <div class="search-wrap">
      <input type="search" id="q" placeholder="Поиск монеты…" autocomplete="off"/>
      <div class="sr-box" id="sr" style="display:none"></div>
    </div>
    <div class="card">
      <div class="card-head">
        <h2 data-i18n="watchlist">Список</h2>
        <div class="card-actions">
          <button type="button" class="btn-ghost" id="addTop">+ Top</button>
          <button type="button" class="btn-ghost" id="refBtn">↻</button>
        </div>
      </div>
      <div class="table-x">
        <table>
          <thead><tr><th>#</th><th>Монета</th><th>Цена</th><th>24h</th><th></th></tr></thead>
          <tbody id="wBody"><tr><td colspan="5" class="empty">…</td></tr></tbody>
        </table>
      </div>
    </div>
    <div class="card" id="detail" style="display:none">
      <div class="coin">
        <img id="dImg" src="" alt="" width="36" height="36" style="display:none"/>
        <div style="min-width:0"><div class="nm" id="dName">—</div><div class="sy" id="dSym">—</div></div>
        <div style="margin-left:auto;text-align:right">
          <div class="pr" id="dPrice">—</div>
          <div id="dCh">—</div>
        </div>
      </div>
      <div id="tv" style="height:280px;width:100%;border-radius:12px;overflow:hidden;margin-top:.5rem"></div>
      <div id="chartTip" class="muted" style="margin-top:.35rem;font-size:.75rem"></div>
      <div class="ex" id="ex" style="margin-top:.6rem"></div>
    </div>
    <div class="card"><h2>В тренде</h2><div id="trends" class="muted">—</div></div>
  </section>
  <section class="page" id="p-port">
    <div class="card">
      <h2>Ручной портфель</h2>
      <p class="muted" style="margin-bottom:.5rem">Выберите монету → количество → Добавить</p>
      <div class="form">
        <div class="field" style="grid-column:1/-1"><label>Монета</label><input type="text" id="mhQ" placeholder="BTC…" autocomplete="off"/><input type="hidden" id="mhCoin"/><div id="mhPicked" class="muted" style="margin-top:.25rem"></div></div>
        <div class="field"><label>Кол-во</label><input type="number" id="mhQty" min="0" step="any" placeholder="0.5" inputmode="decimal"/></div>
        <div class="field"><label>Цена покупки</label><input type="number" id="mhBuy" min="0" step="any" placeholder="опц." inputmode="decimal"/></div>
      </div>
      <div id="mhChips" class="tabs" style="margin:.55rem 0 .35rem;flex-wrap:wrap"></div>
      <button type="button" class="btn" id="mhAdd" style="margin-top:.5rem">+ Добавить</button>
      <div id="mhList" style="margin-top:.85rem"></div>
      <div id="mhTotal" class="pnl-box" style="display:none;margin-top:.7rem"><div class="muted">Итого</div><div style="font-size:1.35rem;font-weight:700" id="mhVal">$0</div><div id="mhPnl" class="muted"></div></div>
      <div id="portChartWrap" style="display:none;margin-top:1rem"><canvas id="portChart" width="240" height="240" style="display:block;margin:0 auto;max-width:100%"></canvas><div id="portLegend" style="text-align:center;margin-top:.6rem;font-size:.75rem"></div></div>
    </div>
  </section>
  <section class="page" id="p-wallet">
    <div class="card">
      <h2>Адрес кошелька</h2>
      <p class="muted" style="margin-bottom:.6rem">Вставьте адрес — баланс и стоимость</p>
      <div class="form">
        <div class="field" style="grid-column:1/-1"><label>Сеть</label>
          <select id="manChain"><option value="eth">Ethereum</option><option value="bsc">BNB Smart Chain</option><option value="polygon">Polygon</option><option value="arb">Arbitrum</option><option value="op">Optimism</option><option value="base">Base</option><option value="sol">Solana</option><option value="ton">TON</option><option value="btc">Bitcoin</option></select>
        </div>
        <div class="field" style="grid-column:1/-1"><label>Адрес</label><input type="text" id="manAddr" placeholder="0x… / EQ… / bc1… / sol…"/></div>
      </div>
      <button type="button" class="btn" id="manBtn" style="margin-top:.65rem">Показать аналитику</button>
      <div id="manRes" style="margin-top:.8rem"></div>
    </div>
  </section>
  <section class="page" id="p-news">
    <div class="card">
      <h2>Новости</h2>
      <div class="tabs" id="newsTabs" style="margin-bottom:.65rem">
        <button type="button" class="tab on" data-f="all">All</button>
        <button type="button" class="tab" data-f="BTC">Bitcoin</button>
        <button type="button" class="tab" data-f="ETH">Ethereum</button>
        <button type="button" class="tab" data-f="SOL">Solana</button>
        <button type="button" class="tab" data-f="market">Market</button>
      </div>
      <div id="newsList" class="muted">…</div>
    </div>
  </section>
  <section class="page" id="p-tools">
    <div class="card"><h2>Конвертер</h2>
      <div class="form">
        <div class="field" style="grid-column:1/-1"><label>Сумма</label><input type="number" id="convAmt" value="1" min="0" step="any" inputmode="decimal"/></div>
        <div class="field"><label>Из</label><select id="convFrom"></select></div>
        <div class="field"><label>В</label><select id="convTo"></select></div>
      </div>
      <div style="margin-top:.7rem;font-weight:700;font-size:1.1rem" id="convOut">—</div>
    </div>
    <div class="card"><h2>DCA</h2>
      <div class="form">
        <div class="field"><label>$/мес</label><input type="number" id="dcaAmt" min="0" step="any" value="100" inputmode="decimal"/></div>
        <div class="field"><label>Месяцы</label><input type="number" id="dcaMonths" min="1" step="1" value="12" inputmode="numeric"/></div>
        <div class="field" style="grid-column:1/-1"><label>Рост %/год</label><input type="number" id="dcaGrowth" step="any" value="20" inputmode="decimal"/></div>
      </div>
      <div style="margin-top:.6rem;font-weight:700" id="dcaOut">—</div>
    </div>
    <div class="card"><h2>Цель прибыли</h2>
      <div class="form">
        <div class="field"><label>Вложено</label><input type="number" id="tpInv" min="0" step="any" placeholder="1000" inputmode="decimal"/></div>
        <div class="field"><label>Цель %</label><input type="number" id="tpPct" min="0" step="any" value="50" inputmode="decimal"/></div>
      </div>
      <div style="margin-top:.6rem;font-weight:700" id="tpOut">—</div>
    </div>
    <div class="card"><h2>Gas</h2><div id="gasBox" class="muted">…</div></div>
  </section>
</div>
<div class="toast" id="toast"></div>
<script src="app.js?v=91"></script>
</body>
</html>
