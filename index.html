<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Crypto Tracker</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0b0e11" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
    :root {
      --bg: #0b0e11;
      --card: #151a21;
      --card-hover: #1c232d;
      --border: #2a3340;
      --text: #eaecef;
      --muted: #848e9c;
      --green: #0ecb81;
      --red: #f6465d;
      --accent: #f0b90b;
    }
    .light {
      --bg: #f6f7f9;
      --card: #ffffff;
      --card-hover: #f0f2f5;
      --border: #e6e9ef;
      --text: #0b0e11;
      --muted: #6b7280;
      --green: #0a9f5a;
      --red: #d23b4a;
      --accent: #b86b00;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Inter, system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      min-height: 100vh;
    }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    header {
      background: var(--card);
      border-bottom: 1px solid var(--border);
      padding: 0.85rem 1.1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.75rem;
      flex-wrap: wrap;
      position: sticky;
      top: 0;
      z-index: 30;
    }
    .logo { font-weight: 700; font-size: 1.1rem; display: flex; align-items: center; gap: 0.45rem; }
    .logo span { color: var(--accent); }
    .global-stats { display: flex; gap: 0.85rem; flex-wrap: wrap; color: var(--muted); font-size: 0.72rem; }
    .global-stats strong { color: var(--text); }
    .controls { display: flex; gap: 0.4rem; align-items: center; flex-wrap: wrap; }
    .select, .toggle-btn {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 6px 8px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.8rem;
    }
    .container { max-width: 1280px; margin: 0 auto; padding: 1rem 1.1rem 2rem; }
    .search-bar { display: flex; gap: 0.55rem; margin-bottom: 1.1rem; align-items: center; flex-wrap: wrap; }
    .search-wrap { position: relative; flex: 1; min-width: 180px; }
    .search-bar input {
      width: 100%;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      padding: 0.65rem 0.85rem;
      font-size: 0.92rem;
      outline: none;
    }
    .search-bar input:focus { border-color: var(--accent); }
    .search-bar button, .btn {
      background: var(--accent);
      color: #000;
      border: none;
      border-radius: 8px;
      padding: 0.65rem 0.95rem;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.85rem;
    }
    .search-bar button:disabled { opacity: 0.55; cursor: wait; }
    .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text); }
    .grid { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 1.1rem; }
    @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 1rem; }
    .card h2 {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      font-size: 0.92rem;
      margin-bottom: 0.8rem;
    }
    .table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    table { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
    th, td { padding: 0.6rem 0.4rem; border-bottom: 1px solid var(--border); text-align: left; white-space: nowrap; }
    th { color: var(--muted); font-weight: 500; }
    tr:hover td { background: var(--card-hover); cursor: pointer; }
    tr.selected td { background: rgba(240, 185, 11, 0.1); }
    .coin-cell { display: flex; align-items: center; gap: 0.5rem; }
    .coin-cell img { width: 24px; height: 24px; border-radius: 50%; }
    .coin-name { font-weight: 600; }
    .coin-symbol { color: var(--muted); font-size: 0.7rem; text-transform: uppercase; }
    .price { font-weight: 700; font-variant-numeric: tabular-nums; }
    .change-up { color: var(--green); }
    .change-down { color: var(--red); }
    .remove-btn { background: transparent; border: none; color: var(--muted); font-size: 1.15rem; cursor: pointer; padding: 0 0.25rem; }
    .remove-btn:hover { color: var(--red); }
    .detail-header { display: flex; align-items: center; gap: 0.65rem; margin-bottom: 0.55rem; }
    .detail-header img { width: 36px; height: 36px; border-radius: 50%; }
    .detail-price { font-size: 1.55rem; font-weight: 700; margin: 0.15rem 0; font-variant-numeric: tabular-nums; }
    .timeframes { display: flex; gap: 0.3rem; margin: 0.75rem 0; flex-wrap: wrap; }
    .tf-btn {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--muted);
      border-radius: 6px;
      padding: 0.32rem 0.65rem;
      cursor: pointer;
      font-size: 0.78rem;
    }
    .tf-btn.active { background: var(--accent); color: #000; border-color: var(--accent); font-weight: 600; }
    .tf-btn:disabled { opacity: 0.45; cursor: wait; }
    .chart-container { position: relative; height: 260px; width: 100%; margin-bottom: 0.7rem; }
    .chart-container canvas { width: 100% !important; height: 100% !important; }
    .chart-loading {
      position: absolute; inset: 0;
      display: none; align-items: center; justify-content: center;
      background: rgba(11, 14, 17, 0.72);
      color: var(--muted);
      z-index: 2;
      border-radius: 8px;
      font-size: 0.85rem;
    }
    .light .chart-loading { background: rgba(255, 255, 255, 0.75); }
    .chart-loading.on { display: flex; }
    .exchanges { display: flex; flex-wrap: wrap; gap: 0.35rem; }
    .ex-link {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.32rem 0.6rem;
      font-size: 0.75rem;
      color: var(--text);
    }
    .ex-link:hover { border-color: var(--accent); text-decoration: none; }
    .search-results {
      position: absolute;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      max-height: 320px;
      overflow-y: auto;
      width: min(420px, 92vw);
      z-index: 50;
      margin-top: 0.2rem;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    }
    .sr-item {
      padding: 0.55rem 0.85rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      cursor: pointer;
      border-bottom: 1px solid var(--border);
    }
    .sr-item:last-child { border-bottom: none; }
    .sr-item:hover { background: var(--card-hover); }
    .sr-item img { width: 22px; height: 22px; border-radius: 50%; }
    .sr-meta { flex: 1; min-width: 0; }
    .sr-name { font-weight: 600; font-size: 0.85rem; }
    .sr-sym { color: var(--muted); font-size: 0.72rem; }
    .sr-rank { color: var(--muted); font-size: 0.7rem; }
    .sr-empty { padding: 0.9rem; color: var(--muted); text-align: center; }
    .trending-list, .news-list { list-style: none; }
    .trending-list li, .news-list li {
      padding: 0.55rem 0;
      border-bottom: 1px solid var(--border);
      font-size: 0.84rem;
    }
    .trending-list li:last-child, .news-list li:last-child { border-bottom: none; }
    .trending-item { display: flex; align-items: center; gap: 0.5rem; cursor: pointer; }
    .trending-item img { width: 22px; height: 22px; border-radius: 50%; }
    .rank { color: var(--muted); font-size: 0.7rem; min-width: 1rem; }
    .top-price { margin-left: auto; font-size: 0.78rem; font-weight: 600; white-space: nowrap; }
    .loading, .empty { color: var(--muted); text-align: center; padding: 1.2rem 0.5rem; font-size: 0.88rem; }
    .attribution { text-align: center; color: var(--muted); font-size: 0.7rem; margin-top: 1.4rem; }
    .toast {
      position: fixed;
      left: 50%;
      bottom: 1.2rem;
      transform: translateX(-50%);
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.65rem 1rem;
      border-radius: 8px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
      z-index: 200;
      max-width: 90vw;
      text-align: center;
      font-size: 0.85rem;
    }
    .toast.show { opacity: 1; }
    .tab-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      border-radius: 6px;
      padding: 0.28rem 0.6rem;
      font-size: 0.75rem;
      cursor: pointer;
    }
    .tab-btn.active { border-color: var(--accent); color: var(--accent); }
  </style>
</head>
<body>
  <header>
    <div class="logo"><span>₿</span> <span id="appTitle">Crypto Tracker</span></div>
    <div class="controls">
      <div class="global-stats" id="globalStats"><span>Загрузка...</span></div>
      <select id="langSelect" class="select" title="Language">
        <option value="ru">RU</option>
        <option value="en">EN</option>
        <option value="pl">PL</option>
      </select>
      <select id="currencySelect" class="select" title="Currency">
        <option value="usd">USD $</option>
        <option value="eur">EUR €</option>
        <option value="rub">RUB ₽</option>
        <option value="pln">PLN zł</option>
        <option value="uah">UAH ₴</option>
      </select>
      <button id="themeToggle" class="toggle-btn" type="button">Dark</button>
    </div>
  </header>

  <div class="container">
    <div class="search-bar">
      <div class="search-wrap">
        <input id="searchInput" type="text" placeholder="Поиск: BTC, ETH, PEPE..." autocomplete="off" />
        <div id="searchResults" class="search-results" style="display:none"></div>
      </div>
      <button id="refreshBtn" type="button">Обновить</button>
    </div>

    <div class="grid">
      <div>
        <div class="card" style="margin-bottom:1.1rem;">
          <h2>
            <span id="watchTitle">Мои монеты</span>
            <button class="btn btn-outline" type="button" id="addPopularBtn" style="padding:0.28rem 0.55rem;font-size:0.75rem;">+Популярные</button>
          </h2>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>#</th>
                  <th>Монета</th>
                  <th>Цена</th>
                  <th>24ч</th>
                  <th>7д</th>
                  <th></th>
                </tr>
              </thead>
              <tbody id="watchlistBody">
                <tr><td colspan="6" class="loading">Загрузка...</td></tr>
              </tbody>
            </table>
          </div>
        </div>

        <div class="card" id="detailCard" style="display:none;">
          <div class="detail-header">
            <img id="detailImg" src="" alt="" />
            <div>
              <div style="font-weight:600" id="detailName"></div>
              <div class="coin-symbol" id="detailSymbol"></div>
            </div>
          </div>
          <div class="detail-price" id="detailPrice">—</div>
          <div id="detailChange" style="font-size:0.88rem;margin-bottom:0.35rem;"></div>

          <div class="timeframes" id="timeframes">
            <button type="button" class="tf-btn" data-days="1">1д</button>
            <button type="button" class="tf-btn active" data-days="7">7д</button>
            <button type="button" class="tf-btn" data-days="30">30д</button>
            <button type="button" class="tf-btn" data-days="90">90д</button>
            <button type="button" class="tf-btn" data-days="365">1г</button>
            <button type="button" class="tf-btn" data-days="max">Max</button>
          </div>

          <div class="chart-container">
            <div id="chartLoading" class="chart-loading">Загрузка графика...</div>
            <canvas id="priceChart"></canvas>
          </div>

          <h2 style="margin-top:0.35rem;">Биржи</h2>
          <div id="exchanges" class="exchanges"></div>
        </div>
      </div>

      <div>
        <div class="card" style="margin-bottom:1.1rem;">
          <h2><span id="sideTitle">🔥 Тренды</span></h2>
          <div style="display:flex;gap:0.35rem;margin-bottom:0.7rem;">
            <button id="tabTrending" type="button" class="tab-btn active" data-tab="trending">Тренды</button>
            <button id="tabTop" type="button" class="tab-btn" data-tab="top">Топ-50</button>
          </div>
          <ul id="sideList" class="trending-list">
            <li class="loading">Загрузка...</li>
          </ul>
        </div>

        <div class="card">
          <h2 id="newsTitle">📰 Новости</h2>
          <ul class="news-list">
            <li><a href="https://www.coindesk.com/" target="_blank" rel="noopener">CoinDesk</a></li>
            <li><a href="https://cointelegraph.com/" target="_blank" rel="noopener">Cointelegraph</a></li>
            <li><a href="https://www.theblock.co/" target="_blank" rel="noopener">The Block</a></li>
            <li><a href="https://decrypt.co/" target="_blank" rel="noopener">Decrypt</a></li>
            <li><a href="https://cryptopanic.com/" target="_blank" rel="noopener">CryptoPanic</a></li>
            <li><a href="https://www.coingecko.com/en/news" target="_blank" rel="noopener">CoinGecko News</a></li>
          </ul>
        </div>
      </div>
    </div>

    <p class="attribution">
      Data by <a href="https://www.coingecko.com/" target="_blank" rel="noopener">CoinGecko</a> ·
      Не финансовый совет ·
      <a href="https://github.com/0xvilya/crypto-tracker" target="_blank">GitHub</a>
    </p>
  </div>

  <div id="toast" class="toast"></div>

  <script src="app.js"></script>
</body>
</html>
