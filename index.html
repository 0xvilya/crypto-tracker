<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#07060f"/>
<title>Crypto Tracker</title>
<link rel="apple-touch-icon" href="icon.svg"/>
<link rel="icon" href="icon.svg"/>
<link rel="manifest" href="manifest.json"/>
<script src="https://s3.tradingview.com/tv.js"></script>
<link rel="stylesheet" href="styles.css?v=75"/>
</head>
<body>
<header class="topbar">
  <div class="logo"><span>₿</span> Crypto Tracker</div>
  <div class="top-actions">
    <span class="chip" id="mcapChip">Cap: —</span>
    <span class="chip" id="domChip">BTC: —</span>
    <span class="chip" id="fgChip">FG: —</span>
    <select id="curSel" class="select"><option value="usd">USD</option><option value="eur">EUR</option><option value="rub">RUB</option><option value="pln">PLN</option></select>
    <select id="langSel" class="select"><option value="en">EN</option><option value="ru">RU</option></select>
    <button type="button" class="select" id="themeBtn">Dark</button>
  </div>
</header>
<nav class="bottom-nav" id="nav">
  <button type="button" class="nav-btn on" data-p="home"><svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M3 10.5L12 3l9 7.5V20a1 1 0 01-1 1h-5v-6H9v6H4a1 1 0 01-1-1v[..."></path></svg></button>
  <button type="button" class="nav-btn" data-p="port"></button>
  <button type="button" class="nav-btn" data-p="news"></button>
  <button type="button" class="nav-btn" data-p="wallet"></button>
  <button type="button" class="nav-btn" data-p="tools"></button>
</nav>
<div class="wrap">
<section class="page on" id="p-home">
  <div class="stats"><div class="stat">24h <b id="st24">—</b></div></div>
  <div class="search-wrap"><input type="search" id="q" placeholder="Search coin…" autocomplete="off" data-i18n-ph="search"/><div class="sr-box" id="sr" style="display:none"></div></div>
  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:.5rem;gap:.4rem;flex-wrap:wrap"><h2 data-i18n="watchlist">Watchlist</h2>
      <div style="display:flex;gap:.35rem;flex-shrink:0"><button type="button" class="btn-ghost" id="addTop">+ Top</button><button type="button" class="btn-ghost" id="refBtn">↻</button></div></div>
    <div class="table-x"><table><thead><tr><th>#</th><th data-i18n="th_coin">Coin</th><th data-i18n="th_price">Price</th><th>24h</th><th></th></tr></thead><tbody id="wBody"><tr><td colspan="5" class="muted">—</td></tr></tbody></table></div>
  </div>
  <div class="card" id="detail" style="display:none">
    <div class="coin" style="margin-bottom:.6rem"><img id="dImg" src="" alt=""/><div style="min-width:0"><div class="nm" id="dName">—</div><div class="sy" id="dSym">—</div></div>
      <div style="margin-left:auto;text-align:right;flex-shrink:0"><div class="pr" id="dPrice">—</div><div id="dCh">—</div></div></div>
    <div id="tv" style="height:320px;width:100%;max-width:100%;border-radius:12px;overflow:hidden"></div>
    <div class="ex" id="ex" style="margin-top:.6rem"></div>
  </div>
  <div class="card"><h2 data-i18n="trending">Trending</h2><div id="trends" class="muted">—</div></div>
</section>
<!-- rest of body unchanged for brevity -->
</div>
<div class="toast" id="toast"></div>

<!-- Core and UI sync must be loaded before other fixes so they can be used by fix.js/fix2.js/fix3.js -->
<script src="core.js"></script>
<script src="ui-sync.js"></script>
<!-- Interactive chart library and chart initializer -->
<script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
<script src="chart.js"></script>
<script src="app.js"></script>
<script src="fix.js?v=75"></script>
<script src="fix2.js?v=75"></script>
<script src="fix3.js?v=75"></script>
</body>
</html>
